<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Programa | Gestão de Projetos em BIM</title><style>
:root{--ink:#171923;--muted:#586075;--purple:#9153ed;--line:#e9e8ef;--lav:#f8f5fc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1100px;margin:auto;padding:clamp(28px,5vw,68px) clamp(20px,5vw,64px) 80px}.eyebrow{font-size:12px;letter-spacing:.27em;font-weight:500;color:#62677b;margin:0 0 12px}h1{font-size:clamp(32px,5.2vw,58px);line-height:1.08;letter-spacing:-.048em;margin:0;font-weight:720;max-width:780px}h1 em{font-style:normal;color:var(--purple)}.intro{font-size:clamp(15px,1.7vw,19px);line-height:1.65;color:var(--muted);max-width:650px;margin:19px 0 0}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:24px;margin-top:54px}.section-label{font-size:11px;letter-spacing:.17em;font-weight:700}.count{font-size:12px;color:#777d8e}.journey{position:relative;margin-top:32px}.journey:before{content:"";position:absolute;left:22px;top:24px;bottom:40px;width:1px;background:linear-gradient(to bottom,#c5a5ff,#eee5fa 70%,#d4b8ff)}.module{position:relative;display:grid;grid-template-columns:46px minmax(0,1fr);gap:22px}.node{z-index:1;width:45px;height:45px;border:1px solid #b889ff;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--purple);font-size:15px;font-weight:650;letter-spacing:-.04em;transition:background .3s,box-shadow .3s}.module.open .node{background:#faf6ff;box-shadow:0 0 0 5px #fbf8ff}.module-content{min-width:0;padding:0 0 40px}.module:not(:last-child) .module-content{border-bottom:1px solid var(--line);margin-bottom:36px}.module-head{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:1px 0 0;color:inherit}.module-head:focus-visible{outline:2px solid var(--purple);outline-offset:7px;border-radius:4px}.module-title{font-size:clamp(20px,2.6vw,28px);line-height:1.22;letter-spacing:-.025em;font-weight:650;max-width:580px}.module-desc{font-size:14px;line-height:1.65;color:var(--muted);max-width:600px;margin:12px 0 0}.toggle{width:30px;height:30px;flex:none;border:1px solid #e8e2f0;border-radius:50%;display:grid;place-items:center;color:var(--purple);font-size:21px;font-weight:300;line-height:1}.details{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .38s ease,opacity .28s ease}.module.open .details{grid-template-rows:1fr;opacity:1}.details-inner{overflow:hidden}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:29px}.micro{font-size:11px;letter-spacing:.12em;font-weight:750;margin:0 0 13px}.topics{list-style:none;padding:0;margin:0;display:grid;gap:11px}.topics li{position:relative;padding-left:15px;font-size:13px;color:#555d71;line-height:1.45}.topics li:before{content:"";position:absolute;left:0;top:.57em;width:5px;height:5px;border-radius:50%;background:var(--purple)}.result{font-size:13px;line-height:1.65;color:#555d71;margin:0}.ai{margin-top:24px;padding:20px 22px;background:var(--lav);border-radius:14px}.ai .micro{display:flex;gap:9px;align-items:center;margin-bottom:9px}.spark{color:var(--purple);font-size:16px}.ai p:last-child{font-size:13px;color:#565b71;line-height:1.6;margin:0}.footer{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;color:#818595;font-size:12px}.toolbar{display:flex;gap:14px;align-items:center}.toolbar button{border:0;background:none;color:#6e627d;font-size:12px;cursor:pointer;padding:5px 0}.toolbar button:hover{color:var(--purple)}@media(max-width:650px){main{padding:31px 21px 55px}.eyebrow{font-size:10px}h1{font-size:35px;letter-spacing:-.045em}.intro{font-size:15px;margin-top:15px}.topline{margin-top:42px}.journey{margin-top:30px}.journey:before{left:18px}.module{grid-template-columns:38px minmax(0,1fr);gap:15px}.node{width:37px;height:37px;font-size:13px}.module-title{font-size:21px}.module-desc{font-size:13px;margin-top:9px}.module-content{padding-bottom:29px}.module:not(:last-child) .module-content{margin-bottom:30px}.details-grid{grid-template-columns:1fr;gap:25px;margin-top:25px}.ai{padding:17px;margin-top:23px}.toggle{width:27px;height:27px;font-size:18px}.toolbar{gap:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}@media print{main{max-width:none;padding:18px}.module{break-inside:avoid}.details{grid-template-rows:1fr!important;opacity:1!important}.toggle,.toolbar{display:none}.journey:before{print-color-adjust:exact}.ai{print-color-adjust:exact}}
</style></head><body><main><header><p class="eyebrow">PROGRAMA</p><h1>Gestão de Projetos em <em>BIM</em></h1><p class="intro">Gestão orientada à informação, aplicação prática e inteligência para tomada de decisão.</p></header><section aria-label="Jornada do programa"><div class="topline"><span class="section-label">A JORNADA</span><div class="toolbar"><span class="count">05 MÓDULOS</span><button id="all" type="button">Expandir todos</button></div></div><div class="journey" id="journey"></div></section><footer class="footer">Da visão estratégica ao aprendizado contínuo.</footer></main><script>
const modules=[
{title:'Visão e Fundamentos',description:'Compreender o BIM como estratégia de gestão orientada à informação.',topics:['BIM como estratégia de gestão','Gestão ágil aplicada a projetos BIM','Inovação e transformação digital','Inteligência Artificial'],result:'Identificação de mudanças na gestão de projetos e os fundamentos necessários para gerar valor com BIM.',ai:'IA como copiloto da Gestão de Projetos: abordagens, oportunidades de aplicação e limites da validação humana.'},
{title:'Iniciação',description:'Estruturar as bases para iniciar um projeto BIM com clareza e alinhamento.',topics:['Usos BIM e objetivos','Premissas e padrões','Stakeholders'],result:'Estruturar a base para iniciar um projeto BIM, reduzindo ambiguidades e antecipando problemas.',ai:'IA na gestão: Engenharia de Prompts, segurança, governança e uso responsável da IA.'},
{title:'Planejamento',description:'Transformar objetivos em planos, responsabilidades e fluxos de trabalho.',topics:['Diretrizes de Modelagem','Plano de Execução BIM','Requisitos de Informações','Ambiente Comum de Dados','Gestão Ágil aplicada ao planejamento'],result:'Elaborar ou analisar um Plano de Execução BIM, estruturando requisitos e fluxos para uma execução coordenada e rastreável.',ai:'IA no Planejamento e Orçamento: identificação de riscos, previsão de desvios e recomendação de ações corretivas.'},
{title:'Execução, Monitoramento e Controle',description:'Acompanhar o desempenho, controlar a qualidade e antecipar problemas.',topics:['Gestão da execução','Monitoramento e controle','Auditoria BIM','CDE como ferramenta de gestão','Ritmo Ágil da Execução'],result:'Acompanhar a execução do projeto com base em evidências, identificar desvios e transformar informações em ações de gestão.',ai:'IA na Auditoria BIM, Gestão de ocorrências e CDE: análise de modelos, priorização de problemas, não conformidades, análises e antecipação de ocorrências.'},
{title:'Encerramento',description:'Transformar resultados e experiências em aprendizado contínuo.',topics:['Indicadores','Avaliação de resultados','Gestão do conhecimento','Melhoria contínua'],result:'Avaliar o desempenho de um projeto, identificar padrões e transformar resultados e aprendizados em melhorias para os próximos empreendimentos.',ai:'IA para transformar aprendizados de cada empreendimento em inteligência para os próximos.'}
];
const journey=document.querySelector('#journey');
modules.forEach((m,i)=>{const section=document.createElement('article');section.className='module'+(i===0?' open':'');const n=String(i+1).padStart(2,'0');section.innerHTML=`<div class="node" aria-hidden="true">${n}</div><div class="module-content"><button class="module-head" aria-expanded="${i===0}" aria-controls="details-${n}" type="button"><span class="module-title">${m.title}</span><span class="toggle" aria-hidden="true">${i===0?'−':'+'}</span></button><p class="module-desc">${m.description}</p><div class="details" id="details-${n}"><div class="details-inner"><div class="details-grid"><div><h3 class="micro">TEMAS</h3><ul class="topics">${m.topics.map(t=>`<li>${t}</li>`).join('')}</ul></div><div><h3 class="micro">RESULTADO</h3><p class="result">${m.result}</p></div></div><div class="ai"><h3 class="micro"><span class="spark">✧</span> IA APLICADA</h3><p>${m.ai}</p></div></div></div></div>`;journey.append(section);section.querySelector('button').addEventListener('click',()=>setOpen(section,!section.classList.contains('open')))});
function setOpen(el,open){el.classList.toggle('open',open);el.querySelector('.module-head').setAttribute('aria-expanded',String(open));el.querySelector('.toggle').textContent=open?'−':'+';updateAll()}
function updateAll(){document.querySelector('#all').textContent=document.querySelectorAll('.module.open').length===modules.length?'Recolher todos':'Expandir todos'}
document.querySelector('#all').addEventListener('click',()=>{const expand=document.querySelectorAll('.module.open').length!==modules.length;document.querySelectorAll('.module').forEach(el=>setOpen(el,expand))});
</script></body></html>
